name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend
        run: dotnet restore

      - name: Build backend
        run: dotnet build Recep.sln --no-restore

      - name: Test backend
        run: dotnet test Recep.sln --no-build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Test frontend
        working-directory: app
        env:
          CHROME_BIN: google-chrome
        run: npm test -- --watch=false --browsers=ChromeHeadless
