services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - recepie-sql-data:/var/opt/mssql
    networks:
      recepie-network:
        aliases:
          - sqlserver
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  recepie-api:
    build:
      context: .
      dockerfile: API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=${DB_NAME:-Recepie};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-Recepie.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-Recepie.Web}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-http://localhost}
      Database__AutoMigrate: "false"
      ReverseProxy__KnownProxies__0: 172.28.0.10
    volumes:
      - recepie-images:/app/wwwroot/images/recipes
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      recepie-network:
        aliases:
          - recepie-api
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error -H 'X-Forwarded-Proto: https' http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  recepie-web:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      recepie-api:
        condition: service_healthy
    networks:
      recepie-network:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 6

networks:
  recepie-network:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  recepie-sql-data:
  recepie-images:
