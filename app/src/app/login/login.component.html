<section class="auth-page page-shell">
  <aside class="auth-brand-panel">
    <p class="ui-label">Welcome back</p>
    <h1 class="page-title">Return to your kitchen notes.</h1>
    <p class="body-copy">Sign in to publish recipes, keep favorites, and continue sharing cooking traditions.</p>
    <div class="botanical-print" aria-hidden="true"></div>
  </aside>

  <form class="auth-form surface-card" (ngSubmit)="login()">
    <div>
      <p class="ui-label">Login</p>
      <h2>Sign in</h2>
      <p>Use your account to manage recipes and reviews.</p>
    </div>

    <label>
      <span class="form-label">Email</span>
      <input
        id="loginEmail"
        type="email"
        class="form-control"
        [(ngModel)]="email"
        name="email"
        autocomplete="email"
        required>
    </label>

    <label>
      <span class="form-label">Password</span>
      <input
        id="loginPassword"
        type="password"
        class="form-control"
        [(ngModel)]="password"
        name="password"
        autocomplete="current-password"
        required>
    </label>

    <button class="btn btn-primary-app w-100" type="submit">Login</button>

    <p class="auth-switch">
      New to Recipie?
      <a routerLink="/register">Create an account</a>
    </p>
  </form>
</section>
